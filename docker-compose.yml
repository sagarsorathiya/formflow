version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: formflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: formflow
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: formflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: formflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: formflow_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://formflow:changeme@postgres:5432/formflow
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      LDAP_URL: ${LDAP_URL}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_ALLOW_INSECURE: ${LDAP_ALLOW_INSECURE:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      DEV_MOCK_LDAP: ${DEV_MOCK_LDAP:-false}
      NODE_ENV: production
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: formflow_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "worker.js"]
    environment:
      DATABASE_URL: postgresql://formflow:changeme@postgres:5432/formflow
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      NODE_ENV: production
    volumes:
      - uploads_data:/data/uploads

volumes:
  postgres_data:
  redis_data:
  uploads_data:
